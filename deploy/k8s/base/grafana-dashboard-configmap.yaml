# TWO DASHBOARDS, BECAUSE THERE ARE TWO QUESTIONS. This ConfigMap used to carry one dashboard that
# tried to answer both at once, and the panels a run-in-progress needs are not the panels a week of
# runs needs. So:
#
#   * `…-production.json` — IS THE PIPELINE WORKING. Counters over a range, rates over time, and one
#     panel whose whole job is to notice a discrepancy: steps that started and never ended. Nothing
#     on it is scoped to a single run, and it needs no ids to be useful — you open it, and either
#     everything is zero where zero is right or something is not.
#   * `…-development.json` — WHAT DID THE PIPELINE DO. One run, read end to end: which actor picked
#     the work up and in what order, how long each step took, and — curated rather than raw — the
#     claude session each actor ran, rendered the way the CLI renders it. It is driven by ids, and
#     its first panel exists to hand you one.
#
# Each links to the other (`links`, matched on the shared `bnk-rlvr-cap-sup-002-ben` tag), carrying
# the time range and variables across, so the crossing from "something is wrong" to "here is what
# happened" is one click.
#
# The product-level resource ADR-PD-0004's own README example names this directly: "a consumer
# product ... wants a Grafana dashboard ConfigMap describing both actors together, with a
# template-variable drill-down between them". `grafana_dashboard: "1"` is the label observability's
# own Grafana sidecar (grafana-sc-dashboard, METHOD=WATCH, NAMESPACE=ALL) already watches
# cluster-wide — dropping this ConfigMap into any namespace is enough, no Grafana-side config change
# needed. The one datasource uid this file names ("loki") comes straight from observability's own
# `grafana` ConfigMap (`datasources.yaml`); this dashboard invents no new datasource. The other two
# in that file are deliberately unused. Prometheus is provisioned WITHOUT a `uid`, so nothing
# portable can name it, and at this volume `count_over_time` over Loki answers the same questions.
# Tempo would be the natural home for a cross-actor waterfall, but it holds NO SPANS AT ALL today,
# and its entry points at port 3100 while the `tempo` Service exposes only 3200 — so a traces panel
# here could render nothing whatever its query. Both of those are observability's own config, not
# ours, which is why the development dashboard draws the run's shape from Loki instead; when they
# are fixed, the `Run` variable already carries exactly the id a trace lookup wants.
#
# WHAT EVERY LINE CARRIES. Each actor installs `correlation.py` at startup: a logging filter, on the
# HANDLERS rather than the root logger, that stamps every record this process emits with
# `correlation_id` and `task_id` (plus `attempt`/`run_id`/`door` where they apply). "Every record"
# includes lines from code none of these repos own — `HttpMailbox`'s own `do_POST door=… outcome=…`
# access log most of all, which used to be identifiable only by the ABSENCE of a task id.
#
#   * `correlation_id` IS THE TRACE ID. One `orchestrate-task` call is one trace: task-orchestration
#     injects W3C `traceparent` on every peer call, the peer's own `HttpMailbox.do_POST` extracts it,
#     and each actor's `correlation.correlation_id()` reads the same 32 hex digits back out. So a
#     value in the development dashboard's `Run` variable IS the id a Tempo lookup would want (see
#     above for why that lookup cannot answer yet), and nothing about correlation ever travels in a
#     door's payload.
#   * `task_id` spans the retries a single correlation id also spans — and the LATER runs of the same
#     task that it does not.
#
# FOUR KINDS OF LINE REACH LOKI, and `event` (a field the emitter writes) tells them apart:
#
#   * `event: "step"` — a named stage, logged twice (`phase: start`, then `ok`/`failed` with
#     `duration_ms`). Both ends are logged deliberately: it is the only way "started and never
#     finished" is expressible at all, which is what the production dashboard's discrepancy panel
#     counts.
#   * `event: "event"` — a point with no duration: accepted, published, tested, retried, opened.
#   * `event: "init" | "assistant" | "user" | "result"` — the SESSION TRANSCRIPT. Each engine runs its
#     `claude` session with `--output-format stream-json` and logs one projected object per turn.
#   * NO `event` AT ALL — the framework's own access log, which is plain text: `| json` would only tag
#     it `__error__="JSONParserErr"`, so its panels use a line filter instead. Since ADR-PASH-0005
#     (papeete-actor-synchronous-messaging-http 0.4.0) that log covers EVERY inbound call, including
#     the ones no door answers — an undeclared door and an unparseable body used to produce no span,
#     no metric and no line at all. Those never reach a handler, so nothing binds their ids; they
#     carry a `correlation_id` because the binding keeps a SERVER span open across the whole call and
#     `correlation.py`'s filter falls back to the active trace id. They carry no `task_id`, which is
#     why every door panel filters on correlation alone. A GET to an unknown path has neither, because
#     it is logged but deliberately never spanned (a readiness probe every few seconds would bury real
#     calls in a deployment's traces) — hence the second query on those panels.
#
# THE RUN AS A SHAPE, AND WHY IT IS BUILT FROM LOGS QUERIES. The development dashboard's first depth
# after picking a run is a node graph beside a state timeline: who took part, who called whom, and
# when each actor was working. Neither invents topology. A NODE is one INBOUND call, read off the
# access log — which is why an actor that REFUSED a call is a node like any other, ringed red with
# the refusal as its subtitle. An EDGE is the caller's own `call-*` step, whose `url` field names the
# callee, and whose stat is that step's real `duration_ms`. `label_format` rebuilds the callee's
# exact `service_name` out of that url —
# `{{ regexReplaceAll "-.*$" .service_name "" }}-{{ regexReplaceAll "^.*-" .url "" }}` — so node and
# edge join on a value neither side hardcodes.
#
# Both are LOGS queries carrying `refId: nodes` / `refId: edges`, not the metric queries the numbers
# would suggest, and that is forced rather than stylistic. Grafana admits a frame to a node graph by
# its refId, but its consumers then read `nodes[0]` and `edges[0]` — the FIRST frame of each kind and
# no other. A Loki metric query returns ONE FRAME PER SERIES, so `sum by (service_name)` would offer
# three separate node frames and exactly one node would be drawn. A logs query returns a single frame
# with one row per line, which is the shape the panel needs; `extractFields` over the `labels` field
# then lifts the `label_format` output into real columns, and `organize` renames them to the names
# the panel reads (`id`, `title`, `subtitle`, `mainstat`, `arc__*`, `detail__*`). The consequence
# worth knowing: the map is a ONE-RUN view. With `Run` left at `.+` it draws every run at once, and
# an actor called more than once collapses onto a single node, because a node is keyed by the actor
# rather than by the call.
#
# AND WHY IT IS TRUNCATED. Rendering alone was not enough to make the session readable: the CLI
# collapses a tool result to a few lines, and this panel did not, so ONE `Read` of a capability
# context file put 40 kB of JSON on screen and buried the run. Each `⎿` is now a single line —
# whitespace collapsed, `trunc`'d, with `… +N lines` from `count` over the newlines — the
# `/tmp/<workdir>/` prefix is stripped off every path, and a turn carrying nothing (an empty
# thinking block, which is all any of them carry today) is filtered out in the query rather than
# rendered as a bare `✻ thinking…`. Timestamps are off, because a terminal has none. Nothing is
# lost by this: the untouched record is what "Dive into a step" deliberately shows.
#
# WHY THE TRANSCRIPT IS RENDERED, NOT DUMPED. A `logs` panel shows the log line, and the log line is
# JSON, so the session used to read as a wall of objects. `line_format` fixes that in the query rather
# than in the emitter: the panel projects each turn back into the shape the CLI itself prints — `⏺
# Bash(…)`, `⎿` for what came back, `●` for prose, `■` for the final result and its cost. Two things
# make that honest rather than a guess. First, the CLI emits one message per content block, so every
# transcript record carries exactly ONE element in `blocks` — `blocks[0]` is the turn, not the first
# of several. Second, Loki's `| json` SKIPS arrays entirely, so `blocks` is invisible to it; the
# second `| json` with explicit expressions (`b_tool="blocks[0].tool_use"`) is what reaches inside,
# and it is required, not stylistic. A nested object addressed that way comes back as its own JSON
# string, which is what lets `b_args` stand in as the argument for a tool whose input key we did not
# name individually.
#
# `task_id` and `correlation_id` are STRUCTURED METADATA, not index labels (Loki promotes only its
# default resource attributes — `service.name`, `service.instance.id`, the `k8s.*` set — when
# ingesting OTLP). That is deliberate: both are unbounded, and one Loki stream per task would be
# exactly the cardinality explosion the label index is not built for. Structured metadata still
# filters with a plain label matcher and needs no parser in front of it — hence both matchers sitting
# BEFORE `| json` in every query below, so a drill-down never pays to parse the records it is about
# to discard. `severity_text` is structured metadata for the same reason and is what the trouble
# panels filter on: it is the OTLP severity itself, so it catches a warning from code none of these
# repos own, which a `| json | level=…` on our own emitted field never could.
#
# Both id variables are TEXTBOX, not query, for the same reason: `label_values()` enumerates the label
# index, which by design contains neither. Their `.+` default means "any record carrying one at all",
# which is every record emitted inside a request and nothing else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-bnk-rlvr-cap-sup-002-ben
  labels:
    grafana_dashboard: "1"
data:
  bnk-rlvr-cap-sup-002-ben-production.json: |
    {
      "title": "BNK.RLVR.CAP.SUP.002.BEN — production",
      "uid": "bnk-rlvr-cap-sup-002-ben-production",
      "tags": [
        "bnk-rlvr-cap-sup-002-ben",
        "papeete-foundry",
        "production"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "links": [
        {
          "title": "Development view",
          "type": "dashboards",
          "tags": [
            "bnk-rlvr-cap-sup-002-ben"
          ],
          "asDropdown": false,
          "icon": "external link",
          "includeVars": true,
          "keepTime": true,
          "targetBlank": false,
          "tooltip": "",
          "url": ""
        }
      ],
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "custom",
            "label": "Actor",
            "multi": true,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "query": "BNK.RLVR.CAP.SUP.002.BEN-implementation,BNK.RLVR.CAP.SUP.002.BEN-testing,BNK.RLVR.CAP.SUP.002.BEN-task-orchestration",
            "options": [
              {
                "text": "BNK.RLVR.CAP.SUP.002.BEN-implementation",
                "value": "BNK.RLVR.CAP.SUP.002.BEN-implementation"
              },
              {
                "text": "BNK.RLVR.CAP.SUP.002.BEN-testing",
                "value": "BNK.RLVR.CAP.SUP.002.BEN-testing"
              },
              {
                "text": "BNK.RLVR.CAP.SUP.002.BEN-task-orchestration",
                "value": "BNK.RLVR.CAP.SUP.002.BEN-task-orchestration"
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 10,
          "title": "Runs started",
          "type": "stat",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "One `orchestrate-task` call accepted at the door. Always read off task-orchestration, whatever the Actor variable says — a run is that actor's own unit of work, and scoping this to a peer would count nothing.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({service_name=~\".+-task-orchestration\"} | json | step=\"orchestration-started\" [$__range]))",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 11,
          "title": "Runs accepted",
          "type": "stat",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "Reached a verdict its criteria passed, and opened the PRs.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({service_name=~\".+-task-orchestration\"} | json | step=\"orchestration-accepted\" [$__range]))",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 12,
          "title": "Runs refused",
          "type": "stat",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "task-orchestration turned the call away, or gave up. `because` carries the reason — see the Warnings & errors panel below.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({service_name=~\".+-task-orchestration\"} | json | step=\"orchestration-refused\" [$__range]))",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 13,
          "title": "Retries",
          "type": "stat",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "An attempt whose tests did not pass, sent back round the implement → test loop. Not an error — but a rising count is the pipeline working harder for the same output.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({service_name=~\".+-task-orchestration\"} | json | step=\"retrying\" [$__range]))",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 14,
          "title": "Steps failed",
          "type": "stat",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "A `stage()` that raised. Its own record carries the exception text in `error`.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({service_name=~\"$service\"} | json | event=\"step\" | phase=\"failed\" [$__range]))",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 15,
          "title": "Calls not accepted",
          "type": "stat",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "Every inbound call whose outcome was not `accepted` — refused, no-route, bad-request. Read straight off the framework's own access log, so it counts the calls no handler of ours ever saw.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
