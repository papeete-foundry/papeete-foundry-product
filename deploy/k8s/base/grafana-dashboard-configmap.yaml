            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({service_name=~\"$service\"} |~ \"^do_(POST|GET) \" != \"outcome=accepted\" [$__range]))",
              "queryType": "instant"
            }
          ]
        },
        {
          "id": 20,
          "title": "Sessions ended",
          "type": "stat",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "One `result` event per claude session — three actors' worth, whichever the Actor variable selects.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
